name: build-kgsl
# Native Adreno OpenGL (freedreno gallium on KGSL, Fryzek's MR kept alive by lfdevs)
# + Turnip Vulkan, built from lfdevs/mesa-for-android-container source.
# Meson options follow sabamdarif/termux-desktop .github/scripts/mesa-freedreno.sh
on:
  workflow_dispatch:
    inputs:
      lfdevs_tag:
        description: lfdevs/mesa-for-android-container tag (mesa-* tag)
        default: 'mesa-27.0.0-devel-20261025-r1'
  push:
    branches: [main]
    paths: ['.github/workflows/build-kgsl.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    env:
      LFDEVS_TAG: ${{ github.event.inputs.lfdevs_tag || 'mesa-27.0.0-devel-20261025-r1' }}
      DEBIAN_FRONTEND: noninteractive
      PREFIX: /opt/mesa-kgsl
    steps:
      - name: Deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl xz-utils build-essential ninja-build pkg-config python3 python3-pip python3-mako python3-yaml python3-packaging python3-ply bison flex glslang-tools libdrm-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-glx0-dev libxext-dev libxfixes-dev libxrandr-dev libxshmfence-dev libxxf86vm-dev libwayland-dev wayland-protocols libwayland-egl-backend-dev libexpat1-dev zlib1g-dev libzstd-dev libelf-dev
          pip3 install --upgrade meson --break-system-packages
          meson --version
      - name: Source
        run: |
          git clone --depth 1 --branch "$LFDEVS_TAG" https://github.com/lfdevs/mesa-for-android-container.git /src
          cd /src && git log -1 --format='%H %s'
      - name: Build
        run: |
          cd /src
          meson setup build --prefix=$PREFIX -Dplatforms=x11,wayland -Dgallium-drivers=freedreno,zink,virgl -Dgallium-va=disabled -Dgallium-mediafoundation=disabled -Dvulkan-drivers=freedreno -Dvulkan-layers= -Dfreedreno-kmds=kgsl -Degl=enabled -Dgles1=disabled -Dgles2=enabled -Dglx=dri -Dglvnd=disabled -Dllvm=disabled -Dintel-rt=disabled -Dmicrosoft-clc=disabled -Dvalgrind=disabled -Dbuild-tests=false -Dlibunwind=disabled -Dlmsensors=disabled -Dandroid-libbacktrace=disabled -Dbuildtype=release --wrap-mode=nofallback
          ninja -C build -j$(nproc)
          DESTDIR=/out ninja -C build install
      - name: Package
        run: |
          cd /out
          find opt -name '*icd*.json' -o -name 'kgsl_dri.so' -o -name 'libGL.so*'
          tar czf /tmp/mesa-kgsl-${LFDEVS_TAG}-ubuntu26-arm64.tar.gz opt
          ls -la /tmp/*.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kgsl-${{ env.LFDEVS_TAG }}
          name: KGSL freedreno + Turnip (${{ env.LFDEVS_TAG }}) for Ubuntu 26.04 arm64
          files: /tmp/mesa-kgsl-${{ env.LFDEVS_TAG }}-ubuntu26-arm64.tar.gz
