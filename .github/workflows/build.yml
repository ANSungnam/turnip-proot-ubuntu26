name: build
on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: Mesa version
        default: '26.2.5'
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    env:
      MESA_VERSION: ${{ github.event.inputs.mesa_version || '26.2.5' }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils build-essential meson ninja-build pkg-config python3-mako python3-yaml python3-packaging bison flex glslang-tools libdrm-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-glx0-dev libxext-dev libxfixes-dev libxrandr-dev libxshmfence-dev libxxf86vm-dev libexpat1-dev zlib1g-dev libzstd-dev
      - name: Source
        run: |
          mkdir -p /src && cd /src
          curl -fsSL https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz | tar xJ --strip-components=1
      - name: Build
        run: |
          cd /src
          meson setup build -Dprefix=/opt/turnip -Dbuildtype=release -Dplatforms=x11 -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dgallium-drivers=zink -Dglx=dri -Degl=enabled -Dgbm=disabled -Dllvm=disabled -Dvideo-codecs=
          ninja -C build -j$(nproc)
          DESTDIR=/out ninja -C build install
      - name: Package
        run: |
          cd /out
          tar czf /tmp/turnip-${MESA_VERSION}-ubuntu26-arm64.tar.gz opt
          ls -la /tmp/*.tar.gz
          find /out/opt -name '*icd*.json' -o -name '*_dri.so' | head
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mesa-${{ env.MESA_VERSION }}
          name: Turnip ${{ env.MESA_VERSION }} for Ubuntu 26.04 arm64
          files: /tmp/turnip-${{ env.MESA_VERSION }}-ubuntu26-arm64.tar.gz
